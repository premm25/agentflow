<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentFlow Observability</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f4f2; --surface-1: #fcfcfb; --border: #dcdbd5; --grid: #ecebe6;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #797870;
    --k-agent: #2a78d6; --k-llm: #eb6834; --k-tool: #1baf7a; --k-eval: #4a3aa7; --k-guard: #eda100; --k-chain: #8d8c84;
    --status-critical: #c93a39; --status-good: #1a7f4b; --status-warning: #a86b00;
    --bar: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-0: #121211; --surface-1: #1a1a19; --border: #33322f; --grid: #262624;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8c8b82;
      --k-agent: #3987e5; --k-llm: #d95926; --k-tool: #199e70; --k-eval: #9085e9; --k-guard: #c98500; --k-chain: #8c8b82;
      --status-critical: #e66767; --status-good: #3fb97f; --status-warning: #e0a13a;
      --bar: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--surface-0); color: var(--text-primary); }
  header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; }
  header .sub { color: var(--text-muted); font-size: 12px; }
  header .tabs { margin-left: auto; display: flex; gap: 4px; }
  .tab { background: none; border: 1px solid var(--border); color: var(--text-secondary); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .tab.on { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }
  .kpis { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 20px 0; }
  .kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; min-width: 130px; }
  .kpi .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  main { padding: 14px 20px 30px; }
  .split { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .card h2 { font-size: 13px; margin: 0 0 8px; }
  .muted { color: var(--text-muted); }
  a.link { color: var(--k-agent); text-decoration: none; font-size: 12px; margin-left: 10px; }
  a.link:hover { text-decoration: underline; }
  .trace-row { padding: 8px 10px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; }
  .trace-row:hover { background: var(--surface-0); }
  .trace-row.sel { border-color: var(--k-agent); background: var(--surface-0); }
  .trace-row .top { display: flex; justify-content: space-between; gap: 8px; }
  .trace-row .id { font-weight: 600; }
  .trace-row .meta { color: var(--text-muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .badge { font-size: 10.5px; font-weight: 600; letter-spacing: .03em; padding: 1px 7px; border-radius: 9px; border: 1px solid currentColor; white-space: nowrap; }
  .b-COMPLETED, .b-DONE, .b-PASS { color: var(--status-good); } .b-FAILED, .b-ABORTED, .b-FAIL { color: var(--status-critical); } .b-IN_PROGRESS, .b-WARN { color: var(--status-warning); }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 6px 0 10px; font-size: 11.5px; color: var(--text-secondary); }
  .legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .wf { position: relative; }
  .wf-row { display: grid; grid-template-columns: 250px 1fr 70px; align-items: center; height: 24px; border-bottom: 1px solid var(--grid); cursor: pointer; }
  .wf-row:hover, .wf-row.sel { background: var(--surface-0); }
  .wf-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; font-size: 12px; }
  .wf-track { position: relative; height: 100%; }
  .wf-bar { position: absolute; top: 6px; height: 12px; border-radius: 3px; min-width: 2px; }
  .wf-bar.err { outline: 2px solid var(--status-critical); outline-offset: 1px; }
  .wf-bar.wait { background: repeating-linear-gradient(45deg, var(--k-chain) 0 4px, transparent 4px 8px) !important; border: 1px solid var(--k-chain); }
  .wf-dur { text-align: right; font-size: 11.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .tip { position: fixed; pointer-events: none; background: var(--text-primary); color: var(--surface-1); padding: 6px 9px; border-radius: 6px; font-size: 11.5px; max-width: 340px; z-index: 10; display: none; }
  pre { background: var(--surface-0); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 11.5px; overflow: auto; max-height: 300px; margin: 6px 0 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); font-size: 12px; font-variant-numeric: tabular-nums; }
  th { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  td.num, th.num { text-align: right; }
  .mbar { display: inline-block; height: 8px; border-radius: 2px; background: var(--bar); vertical-align: middle; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
  label.chk { font-size: 12px; color: var(--text-secondary); cursor: pointer; }
  .err-icon { color: var(--status-critical); font-weight: 700; }

  /* trajectory */
  .tiles { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .tile { background: var(--surface-0); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; min-width: 112px; }
  .tile .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; } .tile .l { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .path { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 2px; margin: 8px 0 14px; }
  .pchip { font-size: 11.5px; padding: 3px 9px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-0); white-space: nowrap; }
  .pchip.agent { border-color: var(--k-agent); } .pchip.validation { border-color: var(--k-eval); } .pchip.hil { border-color: var(--k-guard); border-style: dashed; }
  .pchip.bad { border-color: var(--status-critical); color: var(--status-critical); }
  .pchip.retry { font-weight: 700; }
  .parrow { color: var(--text-muted); font-size: 12px; padding: 0 2px; }
  .steps { position: relative; margin-left: 10px; padding-left: 18px; border-left: 2px solid var(--border); }
  .step { position: relative; background: var(--surface-0); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
  .step::before { content: ""; position: absolute; left: -25px; top: 14px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface-1); border: 2px solid var(--k-chain); }
  .step.agent::before { border-color: var(--k-agent); } .step.validation::before { border-color: var(--k-eval); }
  .step.hil::before { border-color: var(--k-guard); } .step.planner::before { border-color: var(--k-llm); }
  .step.bad { border-color: var(--status-critical); }
  .step h3 { font-size: 12.5px; margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .step .sub { color: var(--text-muted); font-size: 11.5px; margin-top: 2px; }
  .tchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  .tchip { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--k-tool); }
  .tchip.extra { border-color: var(--status-warning); color: var(--status-warning); }
  .tchip.missing { border: 1px dashed var(--status-critical); color: var(--status-critical); }
  .tchip.err { border-color: var(--status-critical); }
  .ok { color: var(--status-good); } .no { color: var(--status-critical); font-weight: 600; }
  select { background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font: inherit; }

  /* embedded inside the orchestrator UI: content only */
  body.embed header h1, body.embed header .sub, body.embed .kpis { display: none; }
  body.embed.has-trace #listCard { display: none; }
  body.embed header { padding: 8px 14px; } body.embed header .tabs { margin-left: 0; }
  body.embed main { padding: 10px 14px 20px; }
  body.embed .split { grid-template-columns: minmax(0, 1fr); }
</style>
</head>
<body>
<header>
  <h1>AgentFlow Observability</h1>
  <span class="sub" id="status">connecting…</span>
  <div class="tabs">
    <button class="tab on" data-tab="traces">Traces</button>
    <button class="tab" data-tab="trajectory">Trajectory</button>
    <button class="tab" data-tab="metrics">Metrics</button>
  </div>
</header>
<div class="kpis" id="kpis"></div>
<main>
  <section id="view-traces">
    <div class="split">
      <div class="card" id="listCard"><h2>Cases (one trace per case)</h2><div id="traceList"></div></div>
      <div class="card" id="traceDetail"><span class="muted">Select a case to see its full orchestration waterfall.</span></div>
    </div>
  </section>
  <section id="view-trajectory" style="display:none">
    <div class="card" id="trajCard"><span class="muted">Select a case to see its agent trajectory.</span></div>
  </section>
  <section id="view-metrics" style="display:none"></section>
</main>
<div class="tip" id="tip"></div>
<script>
const KIND_VAR = {AGENT:'--k-agent', LLM:'--k-llm', TOOL:'--k-tool', EVALUATOR:'--k-eval', GUARDRAIL:'--k-guard', CHAIN:'--k-chain'};
const KIND_LABEL = {AGENT:'Agent / planner', LLM:'LLM call', TOOL:'Tool call', EVALUATOR:'Validator', GUARDRAIL:'Guardrail', CHAIN:'Stage / layer'};
let selTrace = null, selSpan = null, collapse = true, traces = [], metrics = null, tab = 'traces', orchestratorUrl = 'http://localhost:8100';
let lastTraj = '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(ms) {
  if (ms < 1) return '<1 ms'; if (ms < 1000) return Math.round(ms) + ' ms';
  if (ms < 60000) return (ms/1000).toFixed(1) + ' s'; if (ms < 3600000) return (ms/60000).toFixed(1) + ' min';
  return (ms/3600000).toFixed(1) + ' h';
}
const num = n => Number(n || 0).toLocaleString();
const pct = v => v == null ? 'n/a' : Math.round(v * 100) + '%';

/* ---- URL state: ?embed=1 and #trace=<id>&tab=<traces|trajectory|metrics> ---- */
const EMBED = new URLSearchParams(location.search).has('embed');
if (EMBED) document.body.classList.add('embed');
function hashParams() { return new URLSearchParams(location.hash.replace(/^#/, '')); }
function applyHash() {
  const p = hashParams();
  if (p.get('trace')) { selTrace = p.get('trace'); selSpan = null; document.body.classList.add('has-trace'); }
  if (p.get('tab')) setTab(p.get('tab'), false);
  loadDetail(); loadTraj(true); renderList();
}
function setTab(t, updateHash = true) {
  if (!['traces', 'trajectory', 'metrics'].includes(t)) return;
  tab = t;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.tab === t));
  for (const v of ['traces', 'trajectory', 'metrics']) document.getElementById('view-' + v).style.display = t === v ? '' : 'none';
  if (t === 'metrics') renderMetrics();
  if (t === 'trajectory') loadTraj(true);
  if (updateHash) { const p = hashParams(); p.set('tab', t); history.replaceState(null, '', '#' + p.toString()); }
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));

const tip = document.getElementById('tip');
function showTip(e, html) { tip.innerHTML = html; tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 14, innerWidth - 360) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; }
function hideTip() { tip.style.display = 'none'; }

function orchLink(caseId) {  // not shown when already embedded inside the orchestrator UI
  return caseId && !EMBED ? `<a class="link" href="${orchestratorUrl}/ui/#case=${encodeURIComponent(caseId)}" target="_blank">Open case in orchestrator ↗</a>` : '';
}

function renderKpis() {
  if (!metrics) return;
  const m = metrics, st = m.stages || {};
  const k = [
    ['Cases traced', num(m.traces)], ['Completed', num(st.COMPLETED || 0)],
    ['Failed / aborted', num((st.FAILED || 0) + (st.ABORTED || 0))], ['In progress', num(st.IN_PROGRESS || 0)],
    ['Avg active time', fmt(m.avg_active_ms)], ['Avg human wait', fmt(m.avg_hil_wait_ms)],
    ['LLM calls', num(m.llm_calls)], ['Tokens', num(m.tokens)],
    ['Span errors', num(m.errors)], ['Guardrail failures', num(m.guardrail_failures)],
  ];
  document.getElementById('kpis').innerHTML = k.map(([l, v]) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
}

const stageName = s => ({report: 'response'})[s] || s;  // display name of the HITL stage "report"; the identifier in the data is unchanged
function renderList() {
  const el = document.getElementById('traceList');
  el.innerHTML = traces.map(t => `
    <div class="trace-row ${t.trace_id === selTrace ? 'sel' : ''}" data-id="${t.trace_id}">
      <div class="top"><span class="id">${esc(t.case_id || t.trace_id.slice(0, 8))}</span><span class="badge b-${t.stage}">${t.stage.replace('_', ' ')}</span></div>
      <div class="meta">${t.flow ? `flow <b>${esc(t.flow)}</b> · ` : ''}${esc(t.agents || 'planning…')} · active ${fmt(t.active_ms)} · human wait ${fmt(t.hil_wait_ms)} (${t.hil_count}×)</div>
      <div class="meta">${t.spans} spans · ${t.llm_calls} LLM calls · ${num(t.tokens)} tokens${t.errors ? ` · <span class="err-icon">! ${t.errors} error span(s)</span>` : ''}</div>
    </div>`).join('') || '<span class="muted">No traces yet. Submit a case in the orchestrator UI.</span>';
  el.querySelectorAll('.trace-row').forEach(r => r.onclick = () => selectTrace(r.dataset.id));
  const sel = document.getElementById('trajSel');
  if (sel) { const cur = sel.value; sel.innerHTML = traces.map(t => `<option value="${t.trace_id}">${esc(t.case_id || t.trace_id.slice(0, 8))} · ${t.stage.replace('_', ' ')}</option>`).join(''); sel.value = selTrace || cur; }
}
function selectTrace(id) {
  document.body.classList.add('has-trace');
  selTrace = id; selSpan = null; lastTraj = '';
  const p = hashParams(); p.set('trace', id); history.replaceState(null, '', '#' + p.toString());
  loadDetail(); loadTraj(true); renderList();
}

async function loadDetail() {
  if (!selTrace) return;
  const r = await fetch('/api/traces/' + selTrace);
  if (!r.ok) { document.getElementById('traceDetail').innerHTML = '<span class="muted">No spans received for this case yet. They appear as soon as the first step finishes.</span>'; return; }
  renderDetail(await r.json());
}

function renderDetail(d) {
  const spans = d.spans, s = d.summary;
  const t0 = Math.min(...spans.map(x => x.start_ns)), t1 = Math.max(...spans.map(x => x.end_ns));
  const waits = spans.filter(x => x.name === 'hil.wait').map(x => ({a: (x.start_ns - t0) / 1e6, b: (x.end_ns - t0) / 1e6}));
  const CAP = 2500;
  const adj = ms => {
    if (!collapse) return ms;
    let out = ms;
    for (const w of waits) { const len = w.b - w.a, keep = Math.min(len, CAP); const inside = Math.max(0, Math.min(ms, w.b) - w.a); out -= inside - inside * (keep / len); }
    return out;
  };
  const total = Math.max(adj((t1 - t0) / 1e6), 1);
  const legend = Object.keys(KIND_VAR).map(k => `<span><i style="background:var(${KIND_VAR[k]})"></i>${KIND_LABEL[k]}</span>`).join('') +
    `<span><i style="background:repeating-linear-gradient(45deg,var(--k-chain) 0 3px,transparent 3px 6px);border:1px solid var(--k-chain)"></i>Human wait</span>` +
    `<span><i style="outline:2px solid var(--status-critical)"></i><span class="err-icon">!</span> Error</span>`;
  const rows = spans.map((x, i) => {
    const a = adj((x.start_ns - t0) / 1e6), b = adj((x.end_ns - t0) / 1e6);
    const left = (a / total * 100), width = Math.max((b - a) / total * 100, 0.25);
    const isWait = x.name === 'hil.wait', err = x.status === 2;
    const color = `var(${KIND_VAR[x.kind] || '--k-chain'})`;
    const label = x.name === 'hil.wait' ? `hil.wait (${stageName(x.attrs['roa.hil.stage'])}: ${x.attrs['roa.hil.decision']})` : x.name;
    return `<div class="wf-row ${x.span_id === selSpan ? 'sel' : ''}" data-i="${i}">
      <div class="wf-name" style="padding-left:${x.depth * 14}px">${err ? '<span class="err-icon">! </span>' : ''}${esc(label)}</div>
      <div class="wf-track"><div class="wf-bar ${isWait ? 'wait' : ''} ${err ? 'err' : ''}" style="left:${left}%;width:${width}%;background:${color}"></div></div>
      <div class="wf-dur">${fmt((x.end_ns - x.start_ns) / 1e6)}</div></div>`;
  }).join('');
  const sel = spans.find(x => x.span_id === selSpan);
  document.getElementById('traceDetail').innerHTML = `
    <h2>${esc(s.case_id || s.trace_id)} <span class="badge b-${s.stage}">${s.stage.replace('_', ' ')}</span>${orchLink(s.case_id)}
      <a class="link" href="#trace=${s.trace_id}&tab=trajectory" onclick="setTab('trajectory');return false;">Agent trajectory →</a></h2>
    <div class="muted">trace ${s.trace_id} · wall ${fmt(s.duration_ms)} · active ${fmt(s.active_ms)} · human wait ${fmt(s.hil_wait_ms)} · ${s.llm_calls} LLM calls · ${num(s.tokens)} tokens</div>
    ${s.complete ? '' : '<div class="muted">Root span appears when the case finishes; the trace is still open.</div>'}
    <div class="legend">${legend}</div>
    <label class="chk"><input type="checkbox" id="collapse" ${collapse ? 'checked' : ''}> Collapse human waits (they can last hours)</label>
    <div class="wf" id="wf" style="margin-top:8px">${rows}</div>
    ${sel ? `<h2 style="margin-top:14px">${esc(sel.name)}</h2><pre>${esc(JSON.stringify(sel.attrs, null, 2))}</pre>` : '<div class="muted" style="margin-top:10px">Click a span for its attributes.</div>'}`;
  document.getElementById('collapse').onchange = e => { collapse = e.target.checked; renderDetail(d); };
  document.querySelectorAll('.wf-row').forEach(r => {
    const x = spans[+r.dataset.i];
    r.onclick = () => { selSpan = x.span_id; renderDetail(d); };
    r.onmousemove = e => showTip(e, `<b>${esc(x.name)}</b><br>${fmt((x.end_ns - x.start_ns) / 1e6)} · ${esc(x.kind || 'span')}${x.status === 2 ? '<br>ERROR: ' + esc(x.status_msg) : ''}`);
    r.onmouseleave = hideTip;
  });
}

/* ---------------------------------------------------------------- trajectory */
async function loadTraj(force) {
  if (tab !== 'trajectory' && !force) return;
  const card = document.getElementById('trajCard');
  if (!selTrace) { card.innerHTML = trajHeader(null) + '<div class="muted" style="margin-top:8px">Select a case above to see its agent trajectory.</div>'; wireTrajSel(); return; }
  const r = await fetch(`/api/traces/${selTrace}/trajectory`);
  if (!r.ok) { card.innerHTML = trajHeader(null) + '<div class="muted" style="margin-top:8px">No spans received for this case yet.</div>'; wireTrajSel(); return; }
  const d = await r.json(), sig = JSON.stringify(d);
  if (sig === lastTraj) return;
  lastTraj = sig; renderTraj(d);
}
function trajHeader(d) {
  return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Agent trajectory ${d ? '· ' + esc(d.case_id || '') : ''}</h2>
    <select id="trajSel">${traces.map(t => `<option value="${t.trace_id}" ${t.trace_id === selTrace ? 'selected' : ''}>${esc(t.case_id || t.trace_id.slice(0, 8))} · ${t.stage.replace('_', ' ')}</option>`).join('')}</select>
    ${d ? orchLink(d.case_id) : ''}</div>`;
}
function wireTrajSel() { const s = document.getElementById('trajSel'); if (s) s.onchange = () => selectTrace(s.value); }
function chipClass(p) { return p.kind === 'agent' ? 'agent' : p.kind === 'validation' ? 'validation' : p.kind === 'hil' ? 'hil' : p.kind === 'flow' ? 'agent' : ''; }
function renderTraj(d) {
  const m = d.metrics;
  const tiles = [
    ['Steps', m.steps], ['Agent runs', `${m.agent_runs} (${m.distinct_agents} agents)`], ['Retries', m.retries],
    ['Tool calls', m.tool_calls], ['Tool correctness', pct(m.tool_correctness)], ['Missing required', m.missing_required_tool_calls],
    ['Extra calls', m.extra_tool_calls], ['First-try validation', pct(m.first_try_validation_pass_rate)],
    ['Human interventions', m.human_interventions], ['Human wait', fmt(m.human_wait_ms)], ['LLM calls', m.llm_calls],
  ].map(([l, v]) => `<div class="tile"><div class="v">${v ?? 'n/a'}</div><div class="l">${l}</div></div>`).join('');
  const path = d.path.map((p, i) => `${i ? '<span class="parrow">→</span>' : ''}<span class="pchip ${chipClass(p)} ${p.ok ? '' : 'bad'} ${p.retry ? 'retry' : ''}">${p.retry ? '↻ ' : ''}${p.ok ? '' : '✗ '}${esc(p.text)}</span>`).join('');
  const steps = d.phases.map(p => {
    if (p.type === 'planner') return `<div class="step planner ${p.plan_status === 'ok' ? '' : 'bad'}"><h3>Planner Agent <span class="badge ${p.plan_status === 'ok' ? 'b-PASS' : 'b-FAIL'}">${p.plan_status === 'ok' ? 'PLAN OK' : 'NEEDS HUMAN'}</span> <span class="muted">${fmt(p.duration_ms)}</span></h3>
      <div class="sub">Understanding: topic hint <b>${esc(p.hint || 'none')}</b> · horizon <b>${esc(p.horizon || '?')}</b></div>
      <div class="sub">${p.plan_agents.length ? `Plan (${esc(p.plan_source)}): flow <b>${esc(p.case_type)}</b> → ${p.plan_agents.map(esc).join(' → ')}` : 'No valid plan: routed to a human'}</div></div>`;
    if (p.type === 'flow') return `<div class="step planner ${p.status === 'SELECTED' ? '' : 'bad'}"><h3>Flow selection <span class="badge ${p.status === 'SELECTED' ? 'b-PASS' : 'b-WARN'}">${esc(p.status || '?')}</span> <span class="muted">${fmt(p.duration_ms)}</span></h3>
      <div class="sub">${p.flow_id ? `Flow <b>${esc(p.flow_id)}</b> (${esc(p.flow_name || '')} v${esc(p.version || '')}) via <b>${esc((p.source || '').replace(/_/g, ' '))}</b> · intent <b>${esc(p.intent || 'none')}</b>` : 'Registry could not select a flow; the planner proposes one'}</div>
      <div class="sub">${esc(p.reason || '')}</div>${p.agents.length ? `<div class="sub">Participating agents: ${p.agents.map(esc).join(' → ')}</div>` : ''}</div>`;
    if (p.type === 'agent') {
      const called = p.tools.map((t, i) => `<span class="tchip ${t.error ? 'err' : (p.required_tools.includes(t.tool) ? '' : 'extra')}" title="${esc(t.call_id || '')}">${i + 1}. ${esc(t.tool)} <span class="muted">${fmt(t.duration_ms)}</span></span>`).join('');
      const missing = p.missing_tools.map(t => `<span class="tchip missing" title="required by the agent contract but never called">✗ ${esc(t)}</span>`).join('');
      return `<div class="step agent ${p.status === 'DONE' && p.tools_correct ? '' : 'bad'}"><h3>${esc(p.agent_id)} <span class="muted">attempt ${p.attempt}</span> <span class="badge b-${p.status}">${p.status}</span>
        <span class="${p.tools_correct ? 'ok' : 'no'}">${p.tools_correct ? '✓ all required tools called' : '✗ contract not met'}</span> <span class="muted">${fmt(p.duration_ms)} · ${p.evidence} evidence</span></h3>
        <div class="tchips">${called || '<span class="muted">no tool calls</span>'}${missing}</div>
        ${p.extra_tools.length ? `<div class="sub">Outside the required set (dashed-orange): ${p.extra_tools.map(esc).join(', ')}</div>` : ''}</div>`;
    }
    if (p.type === 'validation') return `<div class="step validation ${p.verdicts.some(v => v.verdict === 'FAIL') ? 'bad' : ''}"><h3>Validation layer <span class="muted">${fmt(p.duration_ms)}</span></h3>
      <table><tr><th>Agent</th><th>Attempt</th><th>Verdict</th><th>Failed checks</th><th>Judge</th></tr>${p.verdicts.map(v => `<tr><td>${esc(v.agent_id)}</td><td>${v.attempt ?? ''}</td><td><span class="badge b-${v.verdict}">${v.verdict}</span></td><td>${v.failed_checks.length ? `<span class="no">${v.failed_checks.map(esc).join(', ')}</span>` : '<span class="muted">none</span>'}</td><td>${esc(v.judge || '')}</td></tr>`).join('')}</table></div>`;
    if (p.type === 'hil') return `<div class="step hil"><h3>Human decision <span class="badge b-WARN">${esc(stageName(p.stage))}</span> <b>${esc(p.decision)}</b> <span class="muted">waited ${fmt(p.waited_ms)}</span></h3></div>`;
    if (p.type === 'intake') return `<div class="step ${p.passed ? '' : 'bad'}"><h3>Intake guardrails <span class="${p.passed ? 'ok' : 'no'}">${p.passed ? '✓ passed' : '✗ blocked'}</span></h3></div>`;
    return `<div class="step"><h3>${esc(p.label)} <span class="muted">${fmt(p.duration_ms)}</span></h3></div>`;
  }).join('');
  document.getElementById('trajCard').innerHTML = `${trajHeader(d)}
    <div class="tiles">${tiles}</div>
    <div class="muted" style="font-size:11.5px">Path taken (↻ = retry of an agent, dashed = human step)</div><div class="path">${path}</div>
    <div class="steps">${steps}</div>
    <div class="muted" style="font-size:11.5px;margin-top:6px">Tool chips: solid green = required and called, orange = called outside the agent's required set, dashed red = required but never called.</div>`;
  wireTrajSel();
}

/* ---------------------------------------------------------------- metrics */
function bars(rows, key) {
  const max = Math.max(...rows.map(r => r[key]), 1);
  return rows.map(r => `<tr><td>${esc(r.name)}</td><td class="num">${r.count}</td><td class="num">${fmt(r.avg_ms)}</td><td class="num">${fmt(r.p95_ms)}</td>
    <td class="num">${r.errors ? `<span class="err-icon">! ${r.errors}</span>` : '0'}</td><td style="width:26%"><span class="mbar" style="width:${(r[key] / max * 100).toFixed(1)}%"></span></td></tr>`).join('');
}
function kv(obj, empty) {
  const e = Object.entries(obj || {});
  return e.length ? `<table>${e.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`).join('')}</table>` : `<span class="muted">${empty}</span>`;
}
function renderMetrics() {
  if (tab !== 'metrics' || !metrics) return;
  const m = metrics;
  const groups = {'Planner agent': /^planner_agent/, 'Worker agents': /^agent\./, 'Validation layer': /^(validat)/, 'Response': /^reporting_layer/, 'LLM calls': /^llm\./, 'Tools': /^tool\./, 'Guardrails': /^(guardrail|intake)/};
  const comp = Object.entries(groups).map(([g, re]) => {
    const rows = m.components.filter(c => re.test(c.name));
    return rows.length ? `<div class="card"><h2>${g} <span class="muted">(average latency, bar = avg)</span></h2><table><tr><th>Span</th><th class="num">Count</th><th class="num">Avg</th><th class="num">p95</th><th class="num">Errors</th><th></th></tr>${bars(rows, 'avg_ms')}</table></div>` : '';
  }).join('');
  document.getElementById('view-metrics').innerHTML = `<div class="grid2">
    <div class="card"><h2>Validation verdicts</h2>${kv(m.verdicts, 'No validations yet')}</div>
    <div class="card"><h2>Failed validation checks</h2>${kv(m.failed_checks, 'None failed')}</div>
    <div class="card"><h2>Human-in-the-loop by stage</h2>${kv(Object.fromEntries(Object.entries(m.hil_by_stage).map(([k, v]) => [stageName(k), v])), 'No human waits yet')}</div>
    <div class="card"><h2>LLM usage by model</h2>${m.llm_by_model.length ? `<table><tr><th>Model</th><th class="num">Calls</th><th class="num">In tokens</th><th class="num">Out tokens</th><th class="num">Time</th></tr>${m.llm_by_model.map(x => `<tr><td>${esc(x.model)}</td><td class="num">${x.calls}</td><td class="num">${num(x.input_tokens)}</td><td class="num">${num(x.output_tokens)}</td><td class="num">${fmt(x.ms)}</td></tr>`).join('')}</table>` : '<span class="muted">No LLM calls yet</span>'}</div>
    ${comp}</div>`;
}

async function refresh() {
  try {
    const [t, m] = await Promise.all([fetch('/api/traces').then(r => r.json()), fetch('/api/metrics').then(r => r.json())]);
    traces = t; metrics = m;
    if (!selTrace && traces.length && EMBED === false) { /* leave unselected until the user picks one */ }
    document.getElementById('status').textContent = 'live · updated ' + new Date().toLocaleTimeString();
    renderKpis(); renderList(); renderMetrics();
    if (selTrace) { loadDetail(); loadTraj(false); }
  } catch (e) { document.getElementById('status').textContent = 'dashboard unreachable'; }
}
addEventListener('hashchange', applyHash);
fetch('/api/config').then(r => r.json()).then(c => { orchestratorUrl = c.orchestrator_url; }).catch(() => {});
{ const p = hashParams(); if (p.get('trace')) { selTrace = p.get('trace'); document.body.classList.add('has-trace'); } if (p.get('tab')) setTab(p.get('tab'), false); }
refresh(); setInterval(refresh, 2500);
</script>
</body>
